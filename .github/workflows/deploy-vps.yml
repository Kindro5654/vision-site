name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (root path — no basePath)
        env:
          NEXT_PUBLIC_LEAD_ENDPOINT: https://crm.vision-club.ae/api/webhooks/website-lead
          NEXT_PUBLIC_LEAD_API_KEY: ${{ secrets.LEAD_API_KEY }}
        run: npm run build
        # NEXT_PUBLIC_BASE_PATH intentionally unset so paths point at the domain root

      - name: Install SSH deploy key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Rsync out/ to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            out/ \
            "$VPS_USER@$VPS_HOST:/var/www/vision-site/"

      - name: Smoke test
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          sleep 2
          curl -fsSL "http://$VPS_HOST/" | head -c 200
          echo ""

      - name: Ping IndexNow (Bing, Yandex) with sitemap URLs
        continue-on-error: true
        run: |
          KEY=6c42c827880bf1f5bf60224a94a56df8
          URLS=$(grep -o '<loc>[^<]*</loc>' out/sitemap.xml | sed -e 's#<loc>##' -e 's#</loc>##' | jq -R . | jq -s -c .)
          BODY=$(jq -n -c --arg key "$KEY" --argjson urls "$URLS" \
            '{host:"vision-club.ae", key:$key, keyLocation:("https://vision-club.ae/" + $key + ".txt"), urlList:$urls}')
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY"
